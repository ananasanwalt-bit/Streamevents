<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamEvents – Games</title><style>
body{margin:0;background:#08090e;color:#fff;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:20px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.game,.card{background:#11141c;border:1px solid #293043;border-radius:14px;padding:14px;color:#fff}.game{cursor:pointer;text-align:left}.active{border-color:#8b5cf6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stat{background:#171b25;padding:10px;border-radius:9px}.stat b{display:block;font-size:22px}.layout{display:grid;grid-template-columns:1fr 300px;gap:12px}.arena{height:500px;background:radial-gradient(circle,#171b29,#08090e);border:1px solid #293043;border-radius:14px;position:relative;overflow:hidden}.obj{position:absolute;font-size:30px}.btn,select{width:100%;padding:10px;margin-top:7px;border-radius:9px;background:#171b25;color:white;border:1px solid #293043}.primary{background:#8b5cf6;border:0}.win{position:absolute;inset:0;background:#000c;display:none;place-items:center;text-align:center;z-index:3}.win.show{display:grid}.feed{height:180px;overflow:auto}.event{background:#171b25;padding:8px;margin:5px 0;border-radius:7px}@media(max-width:800px){.layout{grid-template-columns:1fr}.games{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap">
<h1>⚡ StreamEvents</h1><p>🏆 Streamer versucht 10 Wins – der Chat versucht ihn aufzuhalten.</p><div id="games" class="games"></div><div class="stats"><div class="stat">Wins<b id="wins">0 / 10</b></div><div class="stat">❤️ Likes<b id="likes">0</b></div><div class="stat">➕ Follows<b id="follows">0</b></div><div class="stat">🎁 Gifts<b id="gifts">0</b></div></div>
<div class="layout"><div class="card"><div id="arena" class="arena"><div id="win" class="win"><div><h2 id="wt"></h2><p id="wx"></p><button class="btn primary" onclick="newRound()">Nächste Runde</button></div></div></div></div>
<div><div class="card"><b id="name"></b><p id="desc"></p><progress id="bar" max="100" value="0" style="width:100%"></progress><p id="goal"></p></div>
<div class="card"><b>🎁 Gift testen</b><p>Demo-Test der 12 Gift-Zuordnungen.</p><select id="gift"></select><button class="btn primary" onclick="gift()">🎁 Gift testen</button></div>
<div class="card"><b>🧪 Andere Tests</b><button class="btn" onclick="eventIn('FOLLOW')">➕ Follow</button><button class="btn" onclick="eventIn('LIKE',50)">❤️ 50 Likes</button><button class="btn" onclick="eventIn('LIKE',100)">❤️ 100 Likes</button><button class="btn" onclick="eventIn('SHARE')">↗️ Share</button></div>
<div class="card"><b>Live Feed</b><div id="feed" class="feed">Noch keine Events.</div></div></div></div></div>
<script>
const G=[['mountain','🏔️','Berg bezwingen',100],['zombie','🧟','Zombie-Flucht',60],['bridge','🌉','Brücke des Chaos',100],['space','🚀','Weltraum-Flucht',1000],['dungeon','🏰','Dungeon-Ausbruch',10],['race','🏎️','Chat-Rennen',3]];
const gifts=['Rose','TikTok','Hat','Donut','Lion','Tiger','Diamond','Galaxy','Unicorn','Rocket','Crown','Perfume'];
const E=['🪨 Stein','❄️ Schneeball','💨 Windstoß','🧊 Eisfläche','🪨 Steinschlag','🐐 Bergmonster','🌨️ Lawine','💥 Mega-Lawine','🌋 Erdbeben','🌋 Vulkanausbruch','👑 Boss','🌀 Sturm'];
let game=G[0],p=0,w=0,l=0,f=0,gi=0,done=false,timer; const $=x=>document.getElementById(x);
function setup(){G.forEach((g,i)=>{let b=document.createElement('button');b.className='game'+(i?'':' active');b.innerHTML='<b>'+g[1]+' '+g[2]+'</b><br>100 Ziel';b.onclick=()=>{game=g;document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));b.classList.add('active');newRound()};$('games').appendChild(b)});gifts.forEach(x=>{$('gift').innerHTML+='<option>'+x+'</option>'});newRound()}
function newRound(){clearInterval(timer);p=0;done=false;$('win').classList.remove('show');$('name').textContent=game[1]+' '+game[2];$('desc').textContent='Chat-Events greifen den Streamer an.';$('goal').textContent='Ziel: '+game[3];if(game[0]=='zombie')timer=setInterval(()=>{if(!done){p++;upd();if(p>=game[3])win()}},1000);upd()}
function upd(){$('wins').textContent=w+' / 10';$('likes').textContent=l;$('follows').textContent=f;$('gifts').textContent=gi;$('bar').value=Math.min(100,p/game[3]*100)}
function add(x){let e=document.createElement('div');e.className='obj';e.textContent=x;e.style.left=Math.random()*80+'%';e.style.top=Math.random()*75+'%';$('arena').appendChild(e);setTimeout(()=>e.remove(),2500)}
function eventIn(type,v=0){if(done)return;if(type=='FOLLOW')f++;if(type=='LIKE')l+=v;if(type=='GIFT')gi++;let dmg=type=='FOLLOW'?4:type=='LIKE'?Math.max(3,v/20):8+(gifts.indexOf(v)*3);add(type=='GIFT'?E[gifts.indexOf(v)]:'💥');p=Math.max(0,p-dmg);feed(type=='GIFT'?'🎁 '+v:type);upd()}
function feed(x){$('feed').innerHTML='<div class="event"><b>'+x+'</b> → Chat-Event ausgelöst</div>'+$('feed').innerHTML}
function gift(){eventIn('GIFT',$('gift').value)}function win(){if(done)return;done=true;clearInterval(timer);w++;upd();$('wt').textContent=w>=10?'👑 10 WINS!':'🏆 WIN!';$('wx').textContent=w>=10?'Challenge gewonnen!':'Runde gewonnen.';$('win').classList.add('show')}setup();
</script></body></html>
